<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRE-ICE — Your Natural Gas Research Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #0E1726;
    --ink-soft: #1B2639;
    --paper: #FBFAF8;
    --card: #FFFFFF;
    --line: #E2E0DA;
    --muted: #68727F;
    --ice: #1E6FA8;
    --ice-soft: #E8F1F8;
    --fire: #D1601A;
    --fire-soft: #FBEDE3;
    --good: #1C7A42;
    --warn: #A66A00;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 80px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 30px 0 22px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 13px; }

  .mark {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(145deg, var(--fire) 0%, var(--fire) 45%, var(--ice) 55%, var(--ice) 100%);
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 23px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1;
  }

  .tagline { font-size: 12px; color: var(--muted); }

  .meta { display: flex; gap: 22px; font-size: 12px; color: var(--muted); }
  .meta b { display: block; font-size: 17px; color: var(--ink); font-weight: 600; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
  }

  .label {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1.3px;
    color: var(--muted); margin-bottom: 11px;
  }

  textarea {
    width: 100%; min-height: 92px; padding: 15px;
    font-family: inherit; font-size: 16px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 9px; resize: vertical;
    background: var(--paper); color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--ice); outline-offset: -1px; }

  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 13px; }

  button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 11px 20px; border-radius: 8px; border: none;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); font-weight: 500; padding: 8px 13px; font-size: 12.5px;
  }
  button.ghost:hover { color: var(--ink); border-color: var(--muted); }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font-size: 12.5px; padding: 6px 11px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--paper);
    color: var(--muted); cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--ice); }

  .answer { white-space: pre-wrap; font-size: 15.5px; line-height: 1.72; }
  .answer h3 { font-family: 'Space Grotesk', sans-serif; }

  .scores { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .score {
    font-size: 12px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper);
  }
  .score b { font-weight: 600; }
  .score.high { border-color: #BFE0CB; background: #F0F8F3; color: var(--good); }
  .score.medium { border-color: #E8D6AE; background: #FCF6E9; color: var(--warn); }
  .score.low, .score.none { border-color: #E8C8BC; background: var(--fire-soft); color: var(--fire); }

  .source {
    border-top: 1px solid var(--line); padding: 11px 0;
    font-size: 13px; cursor: pointer;
  }
  .source:first-child { border-top: none; }
  .source-head { display: flex; align-items: baseline; gap: 9px; }
  .marker {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500;
    color: var(--ice); background: var(--ice-soft);
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0;
  }
  .sim { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .excerpt {
    display: none; margin-top: 9px; padding: 12px 14px;
    background: var(--paper); border-radius: 7px;
    font-size: 12.5px; color: var(--muted); line-height: 1.6;
  }
  .source.open .excerpt { display: block; }

  .drop {
    border: 1.5px dashed var(--line); border-radius: 10px;
    padding: 24px 16px; text-align: center; color: var(--muted);
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .drop.hot { border-color: var(--ice); background: var(--ice-soft); color: var(--ice); }

  select {
    font-family: inherit; font-size: 12.5px; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--ink); width: 100%; margin-top: 10px;
  }

  .item {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 12.5px; padding: 7px 0; border-top: 1px solid var(--line);
    color: var(--muted);
  }
  .item:first-of-type { border-top: none; }
  .item span { flex: 1; }
  .x { cursor: pointer; color: var(--line); font-size: 15px; line-height: 1; }
  .x:hover { color: var(--fire); }

  .note { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  .busy { font-size: 12.5px; color: var(--ice); }
  .err { font-size: 13px; color: var(--fire); }

  .trail {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
    display: flex; gap: 16px; flex-wrap: wrap;
  }

  .remembered {
    margin-top: 14px; padding: 11px 14px;
    background: var(--fire-soft); border-radius: 8px;
    font-size: 12.5px; color: #8A4513;
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <div class="wordmark">FIRE-ICE</div>
        <div class="tagline">Your natural gas research agent</div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="grid">

    <main>
      <section class="card">
        <div class="label">ASK</div>
        <textarea id="q" placeholder="What drives the Waha basis against Henry Hub?"></textarea>
        <div class="row">
          <button id="go">Ask Fire-Ice</button>
          <span id="busy" class="busy"></span>
          <span id="err" class="err"></span>
        </div>
        <div class="chips" id="examples"></div>
      </section>

      <section class="card" id="result" style="display:none; margin-top:22px">
        <div class="scores" id="scores"></div>
        <div class="answer" id="answer"></div>
        <div id="remembered"></div>
        <div style="margin-top:22px">
          <div class="label">EVIDENCE — CLICK A SOURCE TO READ THE PASSAGE</div>
          <div id="evidence"></div>
        </div>
        <div class="trail" id="trail"></div>
      </section>
    </main>

    <aside>
      <section class="card">
        <div class="label">YOUR LIBRARY</div>
        <div class="drop" id="drop">
          Drop PDFs here<br>
          <span style="font-size:11.5px">or click to choose files</span>
        </div>
        <input type="file" id="file" multiple accept=".pdf,.md,.txt" style="display:none">
        <select id="topic">
          <option value="markets">markets</option>
          <option value="lng_projects">lng_projects</option>
          <option value="contracts">contracts</option>
          <option value="shipping">shipping</option>
          <option value="regulation">regulation</option>
          <option value="companies">companies</option>
          <option value="technology">technology</option>
          <option value="your_notes">your_notes</option>
        </select>
        <div id="docs" style="margin-top:14px"></div>
        <div class="note" style="margin-top:14px">
          Documents, embeddings and memory stay on this machine. Only your
          question and the retrieved passages are sent to the model.
        </div>
      </section>

      <section class="card" style="margin-top:22px">
        <div class="label">MEMORY</div>
        <div id="facts"></div>
        <div class="label" style="margin:18px 0 9px">RECENT SESSIONS</div>
        <div id="recent"></div>
      </section>
    </aside>

  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const EXAMPLES = [
  "How do Henry Hub, TTF and JKM benchmarks differ?",
  "What drives the Waha basis against Henry Hub?",
  "What risks does an LNG project face before FID?",
];

function renderExamples() {
  $("examples").innerHTML = "";
  EXAMPLES.forEach((text) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = text;
    chip.onclick = () => { $("q").value = text; $("q").focus(); };
    $("examples").appendChild(chip);
  });
}

async function loadStatus() {
  try {
    const data = await (await fetch("/api/status")).json();

    $("meta").innerHTML = `
      <div><b>${data.documents.length}</b>documents</div>
      <div><b>${data.chunks}</b>chunks</div>
      <div><b>${data.facts}</b>facts</div>
      <div><b>${data.sessions}</b>sessions</div>`;

    $("docs").innerHTML = data.documents.length
      ? data.documents.map((d) =>
          `<div class="item"><span>${d.name}<br><span style="font-size:11px">${d.topic} · ${d.kb} KB</span></span></div>`
        ).join("")
      : `<div class="note">No documents yet. Drop a PDF above to begin.</div>`;

    if (data.indexing.running) {
      $("busy").textContent = data.indexing.message || "Indexing...";
      setTimeout(loadStatus, 2500);
    } else if (data.indexing.message && data.indexing.finished_at) {
      $("busy").textContent = "";
    }
  } catch (error) {
    // the server is probably still starting
  }
}

async function loadMemory() {
  try {
    const data = await (await fetch("/api/memory")).json();

    $("facts").innerHTML = data.facts.length
      ? data.facts.map((fact, i) =>
          `<div class="item"><span>${fact}</span><span class="x" data-i="${i}" title="Forget this">×</span></div>`
        ).join("")
      : `<div class="note">Nothing learned yet. Fire-Ice records a fact only when it says so explicitly.</div>`;

    document.querySelectorAll(".x").forEach((el) => {
      el.onclick = async () => {
        await fetch("/api/forget", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: Number(el.dataset.i) }),
        });
        loadMemory(); loadStatus();
      };
    });

    $("recent").innerHTML = data.recent.length
      ? data.recent.map((r) =>
          `<div class="item"><span>${r.question}<br><span style="font-size:11px">${r.at}</span></span></div>`
        ).join("")
      : `<div class="note">No past sessions yet.</div>`;
  } catch (error) {
    // ignore
  }
}

async function ask() {
  const question = $("q").value.trim();
  if (!question) return;

  $("go").disabled = true;
  $("busy").textContent = "Retrieving locally, then reasoning...";
  $("err").textContent = "";
  $("result").style.display = "none";

  try {
    const response = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, k: 6 }),
    });
    const data = await response.json();

    if (data.error) {
      $("err").textContent = data.error;
      return;
    }

    const rc = data.retrieval_confidence || {};
    const agent = data.agent_confidence || "";
    const agentLevel = (agent.match(/^(high|medium|low)/i) || ["", "none"])[1].toLowerCase();

    $("scores").innerHTML = `
      <div class="score ${rc.label || "none"}">
        <b>Retrieval ${rc.label || "—"}</b> · top ${rc.top ?? "—"} across ${rc.sources_used ?? 0} document(s)
      </div>
      <div class="score ${agentLevel}">
        <b>Agent ${agentLevel === "none" ? "—" : agentLevel}</b>${agent ? " · " + agent.replace(/^(high|medium|low)\s*[—-]?\s*/i, "") : ""}
      </div>`;

    $("answer").textContent = data.answer || "";

    $("remembered").innerHTML = data.trail && data.trail.remembered
      ? `<div class="remembered"><b>Remembered:</b> ${data.trail.remembered}</div>`
      : "";

    $("evidence").innerHTML = (data.evidence || []).map((e) => `
      <div class="source">
        <div class="source-head">
          <span class="marker">${e.marker}</span>
          <span>${e.citation}</span>
          <span class="sim">${e.similarity}</span>
        </div>
        <div class="excerpt">${e.excerpt.replace(/</g, "&lt;")}…</div>
      </div>`).join("");

    document.querySelectorAll(".source").forEach((el) => {
      el.onclick = () => el.classList.toggle("open");
    });

    const t = data.trail || {};
    $("trail").innerHTML = `
      <span>retriever ${t.retriever || ""} (local)</span>
      <span>generator ${t.generator || ""}</span>
      <span>${t.passages_retrieved || 0} passages</span>
      <span>memory ${t.memory_used ? "used" : "not used"}</span>`;

    $("result").style.display = "block";
    loadMemory(); loadStatus();
  } catch (error) {
    $("err").textContent = "Could not reach the local server.";
  } finally {
    $("go").disabled = false;
    $("busy").textContent = "";
  }
}

async function upload(files) {
  if (!files.length) return;
  const form = new FormData();
  [...files].forEach((f) => form.append("files", f));
  form.append("topic", $("topic").value);

  $("busy").textContent = "Uploading...";
  try {
    await fetch("/api/upload", { method: "POST", body: form });
    $("busy").textContent = "Indexing locally — this can take a few minutes.";
    loadStatus();
  } catch (error) {
    $("err").textContent = "Upload failed.";
  }
}

$("go").onclick = ask;
$("q").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
});

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => upload(e.target.files);
["dragenter", "dragover"].forEach((evt) =>
  $("drop").addEventListener(evt, (e) => { e.preventDefault(); $("drop").classList.add("hot"); }));
["dragleave", "drop"].forEach((evt) =>
  $("drop").addEventListener(evt, (e) => { e.preventDefault(); $("drop").classList.remove("hot"); }));
$("drop").addEventListener("drop", (e) => upload(e.dataTransfer.files));

renderExamples();
loadStatus();
loadMemory();
</script>
</body>
</html>
